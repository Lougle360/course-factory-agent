# 学员画像卡 · 一线客服 / 投诉处理岗
#
# ⚠️ 画像不是「岗位名」，是「一组能直接驱动取舍的判据」。
#    与 profile-A 对照阅读：同样的 63 个组件，因 constraints 不同，
#    取舍方向上几乎是互补的。

profile_id: P-B-frontline-service
label: 一线客服 / 投诉处理岗
version: 0.1.0
source_kb: nvc-communication
source_kb_label: 《非暴力沟通（修订版）》L2 组件库（63 组件）

# ── 一、现场情境 ────────────────────────────────────────
scenes:
  - 接到情绪激动的投诉电话，对方开口就是问责
  - 遭遇辱骂、人身攻击或长时间情绪宣泄
  - 政策/权限不允许，必须对对方说「不」
  - 连续高强度接线，工位间没有情绪恢复窗口

# ── 二、痛点 ────────────────────────────────────────────
pains:
  - 被当出气筒，情绪一上头话术就崩，事后自责
  - 背锅：规则不是我定的，骂却由我挨
  - 离职率高，情绪耗竭而非技能不足是主因

# ── 三、约束（决定取舍的第一因）──────────────────────────
constraints:
  power: 无规则修改权、无制裁权，只能执行既定政策
  power_effect: >
    他说什么都不算承诺，只能在「执行者」身份内腾挪。
    「赞赏」「惩罚」这类涉及奖惩权力的组件对他不成立。
  time_per_interaction: 单次接触 3–8 分钟，且通话量有考核——不能做长时间同理
  autonomy: 需在既定话术框架内作业，自由发挥空间小
  primary_risk: >
    最大失败不是某一通电话没谈成，而是情绪失守与人员流失。

# ── 四、课时预算 ────────────────────────────────────────
time_budget:
  total_min: 360
  layout: 1 天

# ── 五、选取判据（selection rules）───────────────────────
selection_rules:
  - id: R1
    condition: 短时、可立刻上手、不依赖对方配合的句式/工具
    action: promote
    to_position: 模块序列中段主力
    reason: 客服要在通话中即时调用，无法调用任何需要对方耐心的东西

  - id: R2
    condition: 涉及自我情绪稳定（被攻击当下先稳住自己）的组件
    action: promote
    to_position: 模块序列最前（M1）
    reason: 这是本画像的第一需求。情绪失守则后续所有技巧归零，必须先解决

  - id: R3
    condition: 涉及「对方的情绪不是针对你」的归因类组件
    action: promote
    to_position: 前置（M2）
    reason: 归因翻转是止损点，早讲一天少流失一个人

  - id: R4
    condition: 需要 15 分钟以上持续同理才见效的组件
    action: drop
    reason: 单次通话 3–8 分钟，讲这类技巧等于教他用不起的东西，误导

  - id: R5
    condition: 涉及制裁权/奖励权正当性的组件
    action: drop
    reason: 客服不具备这类权力，讲了不产生行为改变

  - id: R6
    condition: 亲密关系场景的案例（配偶、子女、室友、朋辈）
    action: drop
    reason: 与工作内容无关

  - id: R7
    condition: 双边/多边冲突调解流程
    action: drop
    reason: 不是客服岗位职责，他不需要调和两方

  - id: R8
    condition: 长周期的个人修养与成长路径类组件
    action: demote
    to_position: 收尾模块，只做承诺与预期管理
    reason: 课时只有 1 天，成长路径无法在课堂上推进，但要让他知道路还长

# ── 六、验收口径 ────────────────────────────────────────
acceptance:
  - 被辱骂时能在 10 秒内完成一次自我转向，不在通话中失守
  - 现场能说出至少 3 句可直接使用的短句，并当场用对
  - 能说清「对方骂的不是我」的归因逻辑，不当面反驳也不内耗
  - 交接班时不把情绪带出工位
