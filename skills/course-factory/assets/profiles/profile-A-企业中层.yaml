# 学员画像卡 · 企业中层管理者
#
# ⚠️ 画像不是「岗位名」，是「一组能直接驱动取舍的判据」。
#    只写「中层管理者」四个字，AI 会编出通用版；写了 constraints + selection_rules，
#    编排才有依据，也才能被复算和质疑。

profile_id: P-A-mid-manager
label: 企业中层管理者
version: 0.1.0
source_kb: nvc-communication
source_kb_label: 《非暴力沟通（修订版）》L2 组件库（63 组件）

# ── 一、现场情境（课程要能直接回落到这里）────────────────
scenes:
  - 向团队下达不受欢迎的目标或决策，现场没人反对、事后没人执行
  - 跨部门协调资源，对方口头答应、实际不动
  - 绩效面谈，下属防御、对抗或直接沉默
  - 会议中同事互相推责，需要在场当场收敛

# ── 二、痛点 ────────────────────────────────────────────
pains:
  - 反馈失真：下属当面答应、背后不干，管理层听不到真话
  - 跨部门推不动，只能往上升级，代价高
  - 绩效谈话变成争吵，最后靠职级压过去，关系受损

# ── 三、约束（决定取舍的第一因）──────────────────────────
constraints:
  power: 拥有资源分配权、绩效评价权与制裁权
  power_effect: >
    他的「请求」对下属天然带「要求」色彩，对方不敢真的说「不」。
    因此他以为自己在请求，实际在命令，且长期听不到真实反馈。
  time_per_interaction: 单次沟通 10–60 分钟，有充足的持续同理时间
  autonomy: 可自主选择沟通方式，不受话术脚本约束
  primary_risk: >
    最大的失败不是某次沟通没谈成，而是「用权力掩盖沟通失败」而自己不知道。

# ── 四、课时预算 ────────────────────────────────────────
time_budget:
  total_min: 720
  layout: 2 天 × 360 分钟

# ── 五、选取判据（selection rules）───────────────────────
# action: promote = 提前/加权重 | demote = 后置/降时长 | drop = 不进课
selection_rules:
  - id: R1
    condition: 涉及「权力差下请求是否变形为要求」的组件
    action: promote
    to_position: 模块序列最前
    reason: 下属不敢拒绝，管理者听不到真实反馈——这是本画像的第一盲区，不先破它，后面所有技巧都会被「我说了算」抵消

  - id: R2
    condition: 涉及制裁、惩罚、强制力正当性的组件
    action: promote
    reason: 管理者每天都在行使这类权力，用错伤害面最大，且他自己通常不觉得有问题

  - id: R3
    condition: 涉及向下反馈与赞赏的组件
    action: promote
    reason: 表扬是管理者高频动作，也是最常做错的（表扬本身即评判）

  - id: R4
    condition: 涉及双边/多边冲突调解流程的组件
    action: promote
    reason: 跨部门协调是中层的核心场景之一

  - id: R5
    condition: 需要 30 分钟以上持续同理才见效的案例
    action: promote
    reason: 管理者的单次互动时长足够，长时同理案例可信且可用

  - id: R6
    condition: 以「被攻击方自我保护」为主线的组件
    action: demote
    reason: 中层不是主要受害方，相关组件后置即可

  - id: R7
    condition: 亲密关系场景的案例（配偶、子女、室友、朋辈）
    action: drop
    reason: 与职场场景距离远，容易引发跑题的私人话题讨论，挤占课时

  - id: R8
    condition: 压缩到单次接触 3–8 分钟的极短时技巧
    action: demote
    reason: 管理者无需压缩到秒级，讲了反而显得轻佻

# ── 六、验收口径（学完能干什么，写可观察行为）────────────
acceptance:
  - 能指认自己上周说过的至少 3 句「伪装成请求的要求」
  - 一次绩效面谈后，不再出现「下属当场沉默、事后集体反弹」
  - 能在不动用惩罚的前提下处理一次绩效问题
  - 能说出「同理≠同意」的边界，不在同理后被对方反将一军
